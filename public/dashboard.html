<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - WebzHook Guard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <h1 class="logo">⚡ WebzHook Guard</h1>
      <div class="nav-links">
        <div class="user-badge">
          <img id="user-avatar" class="user-avatar" alt="Profile">
          <span id="username"></span>
        </div>
        <a href="/auth/logout" class="btn btn-secondary btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <section class="servers-section">
      <div>
        <h2 class="section-title">Your Servers</h2>
        <p class="section-subtitle">Select a server to manage WebzHook Guard settings</p>
      </div>

      <div id="servers-container" class="servers-grid">
        <div style="text-align: center; color: #a0a0c0; padding: 60px 20px;">
          <div class="spinner" style="margin: 0 auto 16px;"></div>
          Loading your servers...
        </div>
      </div>
    </section>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const userRes = await fetch('/api/user');
        if (!userRes.ok) return window.location.href = '/';
        
        const user = await userRes.json();
        document.getElementById('username').textContent = user.username;
        document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;

        const guildsRes = await fetch('/api/guilds');
        const guilds = await guildsRes.json();

        const container = document.getElementById('servers-container');
        
        if (guilds.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #a0a0c0;">
              <div style="font-size: 48px; margin-bottom: 16px;">📭</div>
              <p style="margin-bottom: 16px;">No servers found where you have permission</p>
              <a href="https://discord.com/api/oauth2/authorize?client_id=YOUR_CLIENT_ID&scope=bot&permissions=8" class="btn btn-primary">Invite Bot to Server</a>
            </div>
          `;
          return;
        }

        container.innerHTML = guilds.map(g => `
          <div class="server-card">
            <img src="https://cdn.discordapp.com/icons/${g.id}/${g.icon || '0'}.png?size=256" alt="${g.name}" class="server-icon" 
              onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><rect fill=%22%235865f2%22 width=%22120%22 height=%22120%22/><text x=%2260%25%22 y=%2260%25%22 fill=%22white%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2240%22>${g.name[0]}</text></svg>'">
            <h3 class="server-name">${g.name}</h3>
            <p class="server-meta">${g.owner ? '👑 Owner' : '🔧 Admin'}</p>
            <div class="server-buttons">
              <a href="/guild/${g.id}" class="btn btn-primary btn-block">Manage</a>
              <a href="https://discord.com/channels/${g.id}" class="btn btn-secondary btn-block" target="_blank">Open</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        window.location.href = '/';
      }
    }

    window.addEventListener('load', loadDashboard);
  </script>
</body>
</html>

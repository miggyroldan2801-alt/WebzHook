<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — WebzHook Guard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-logo">⚡ WebzHook Guard</a>
    <div class="navbar-right">
      <div class="user-chip">
        <img id="nav-avatar" src="" alt="">
        <span id="nav-username">Loading...</span>
      </div>
      <a href="/auth/logout" class="btn btn-ghost btn-sm">Logout</a>
    </div>
  </nav>

  <div style="max-width:1200px;margin:0 auto;padding:48px 32px;">
    <div class="dash-header">
      <h1>Your Servers</h1>
      <p>Select a server where you're an admin to manage WebzHook Guard</p>
    </div>
    <div id="servers-container" class="servers-grid">
      <div class="page-loader" style="grid-column:1/-1">
        <div class="spinner"></div>
        <span>Loading servers...</span>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script>
    function toast(msg, type='success') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.getElementById('toasts').appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    async function load() {
      try {
        const [meRes, guildsRes] = await Promise.all([fetch('/api/me'), fetch('/api/guilds')]);
        if (!meRes.ok) { window.location.href = '/'; return; }

        const me     = await meRes.json();
        const guilds = await guildsRes.json();

        document.getElementById('nav-username').textContent = me.globalName || me.username;
        document.getElementById('nav-avatar').src = me.avatar
          ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png`
          : `https://cdn.discordapp.com/embed/avatars/0.png`;

        const container = document.getElementById('servers-container');

        if (!guilds.length) {
          container.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
              <div class="empty-icon">📭</div>
              <h3>No servers found</h3>
              <p>You need to be an admin or owner in a server, and the bot needs to be invited.</p>
              <a href="https://discord.com/api/oauth2/authorize?scope=bot&permissions=8" class="btn btn-primary">Invite Bot to a Server</a>
            </div>`;
          return;
        }

        container.innerHTML = guilds.map(g => {
          const icon  = g.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=256` : `https://cdn.discordapp.com/embed/avatars/0.png`;
          const isOn  = g.settings?.enabled && g.settings?.detectionEnabled;
          const badge = g.owner ? '👑 Owner' : '🔧 Admin';
          return `
            <a href="/guild/${g.id}" class="server-card">
              <div class="server-icon-wrap">
                <img src="${icon}" class="server-icon" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" alt="${g.name}">
                <div class="server-status-dot ${isOn ? 'active' : 'inactive'}"></div>
              </div>
              <div class="server-name">${g.name}</div>
              <div class="server-meta">${badge} &nbsp;•&nbsp; ${isOn ? '<span style="color:var(--green);">🟢 Protected</span>' : '<span style="color:var(--text3);">⚪ Inactive</span>'}</div>
              <span class="btn btn-primary btn-sm" style="margin-top:4px;">Manage →</span>
            </a>`;
        }).join('');

      } catch (err) {
        toast('Failed to load: ' + err.message, 'error');
        console.error(err);
      }
    }

    load();
  </script>
</body>
</html>
